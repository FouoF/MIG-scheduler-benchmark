apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: resource-job-a
  annotations:
    migbench.io/compute-core-ms: "2800000"
    migbench.io/requested-memory-mb: "18432"
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: mig.nvidia.com
        selectors:
        - cel: {expression: "device.capacity['gpu.nvidia.com'].memory.compareTo(quantity('18432Mi')) >= 0 && device.capacity['gpu.nvidia.com'].multiprocessors.compareTo(quantity('20')) >= 0"}
---
apiVersion: v1
kind: Pod
metadata: {name: resource-job-a}
spec:
  containers:
  - name: pause
    image: registry.k8s.io/pause:3.10.1
    resources: {claims: [{name: gpu}]}
  resourceClaims:
  - name: gpu
    resourceClaimName: resource-job-a
